name: Release and publish
on:
  push:
    branches: [main]
    paths:
      - package.json
      - server.json
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write # OIDC for npm trusted publishing and the MCP Registry

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - run: corepack enable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - name: Check for version bump
        id: check
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to npm
        if: steps.check.outputs.skip == 'false'
        run: |
          yarn install --immutable
          yarn build
          npm install -g npm@^11.5.1
          if npm view "@arcadia-finance/mcp-server@${{ steps.check.outputs.version }}" version --prefer-online >/dev/null 2>&1; then
            echo "npm already has ${{ steps.check.outputs.version }}, skipping publish."
          else
            npm publish --access public
          fi

      # ─── Downstream registry publishes ───

      - name: Install mcp-publisher
        if: steps.check.outputs.skip == 'false'
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
      - name: Authenticate to MCP Registry (OIDC)
        if: steps.check.outputs.skip == 'false'
        run: ./mcp-publisher login github-oidc
      - name: Publish to MCP Registry
        if: steps.check.outputs.skip == 'false'
        env:
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          already=$(curl -sf --max-time 30 \
            "https://registry.modelcontextprotocol.io/v0/servers?search=io.github.arcadia-finance/mcp-server&version=${VERSION}" \
            | jq '[.servers[]?] | length' 2>/dev/null)
          if [ "${already:-0}" -gt 0 ]; then
            echo "MCP Registry already has ${VERSION}, skipping publish."
            exit 0
          fi
          for i in $(seq 1 30); do
            if curl -sf --max-time 10 -o /dev/null \
              "https://registry.npmjs.org/@arcadia-finance%2fmcp-server/${VERSION}"; then
              ./mcp-publisher publish
              exit 0
            fi
            sleep 10
          done
          echo "npm still does not serve ${VERSION} after 5 minutes" >&2
          exit 1

      - name: Check openclaw skill version
        if: steps.check.outputs.skip == 'false'
        id: skill
        run: |
          CURR=$(awk '/^version:/ { print $2; exit }' openclaw/SKILL.md)
          if [ -z "$CURR" ]; then
            echo "Could not read version from openclaw/SKILL.md frontmatter."
            exit 1
          fi
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$LAST_TAG" ]; then
            PREV=$(git show "${LAST_TAG}:openclaw/SKILL.md" 2>/dev/null | awk '/^version:/ { print $2; exit }' || echo "")
          else
            PREV=""
          fi
          if [ "$CURR" = "$PREV" ]; then
            echo "Skill version unchanged ($CURR); skipping ClawHub publish."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "version=$CURR" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish ClawHub skill
        if: steps.check.outputs.skip == 'false' && steps.skill.outputs.changed == 'true'
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
        run: |
          if [ -z "$CLAWHUB_TOKEN" ]; then
            echo "::warning::CLAWHUB_TOKEN not set, skipping ClawHub publish."
            exit 0
          fi
          npx -y clawhub login --token "$CLAWHUB_TOKEN" --no-input
          npx -y clawhub publish "$PWD/openclaw" \
            --slug arcadia-finance \
            --name "Arcadia Finance" \
            --version "${{ steps.skill.outputs.version }}" \
            --no-input

      # ─── Verify before tagging ───
      - name: Verify publishes landed
        if: steps.check.outputs.skip == 'false'
        env:
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          fail=0
          PKG="@arcadia-finance/mcp-server"
          REGISTRY_URL="https://registry.modelcontextprotocol.io/v0/servers?search=io.github.arcadia-finance/mcp-server&version=latest"

          npm_has_version() {
            npm view "${PKG}@${VERSION}" version --prefer-online >/dev/null 2>&1
          }

          registry_has_version() {
            curl -sf --max-time 30 "$REGISTRY_URL" \
              | jq -e --arg v "$VERSION" '[.servers[] | select(.server.version == $v)] | length > 0' \
                  >/dev/null 2>&1
          }

          npm_ok=0
          registry_ok=0
          slept=0
          while :; do
            if [ "$npm_ok" -eq 0 ] && npm_has_version; then
              echo "npm: ${VERSION} present"
              npm_ok=1
            fi
            if [ "$registry_ok" -eq 0 ] && registry_has_version; then
              echo "MCP Registry: ${VERSION} present"
              registry_ok=1
            fi
            [ "$npm_ok" -eq 1 ] && [ "$registry_ok" -eq 1 ] && break
            [ "$slept" -ge 90 ] && break
            echo "waiting for propagation, retrying in 10s (${slept}s elapsed)"
            sleep 10
            slept=$((slept + 10))
          done

          if [ "$npm_ok" -eq 0 ]; then
            echo "::group::npm view output"
            npm view "${PKG}@${VERSION}" version --prefer-online || true
            echo "::endgroup::"
            echo "::error::npm does not report ${VERSION} after ${slept}s"
            fail=1
          fi
          if [ "$registry_ok" -eq 0 ]; then
            echo "::group::MCP Registry response"
            curl -s --max-time 30 "$REGISTRY_URL" || true
            echo "::endgroup::"
            echo "::error::MCP Registry does not report ${VERSION} after ${slept}s"
            fail=1
          fi

          exit $fail

      # ─── Tag and release LAST ───
      - name: Create tag and release
        if: steps.check.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git tag "${{ steps.check.outputs.tag }}"
          git push origin "${{ steps.check.outputs.tag }}"
          gh release create "${{ steps.check.outputs.tag }}" \
            --title "${{ steps.check.outputs.tag }}" \
            --generate-notes \
            || gh release view "${{ steps.check.outputs.tag }}" >/dev/null
