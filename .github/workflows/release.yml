name: Release and publish
on:
  push:
    branches: [main]
    paths:
      - package.json
      - server.json
  # Manual retry: the version-bump gate still applies, so this is a no-op unless
  # the tag for the current package.json version is absent.
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write # required for MCP Registry OIDC authentication

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # actions/checkout passes --no-tags unless this is set, so without it the
          # version gate below runs `git rev-parse` against a tagless clone and can
          # never detect an already-released version.
          fetch-tags: true
      - run: corepack enable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: yarn
          registry-url: https://registry.npmjs.org
      - name: Check for version bump
        id: check
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to npm
        if: steps.check.outputs.skip == 'false'
        run: |
          yarn install --immutable
          yarn build
          # Tolerate an already-published version so a retry after a later-step
          # failure does not abort here.
          if npm view "@arcadia-finance/mcp-server@${{ steps.check.outputs.version }}" version >/dev/null 2>&1; then
            echo "npm already has ${{ steps.check.outputs.version }}, skipping publish."
          else
            npm publish --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # ─── Downstream registry publishes ───
      # Fire only after npm publish succeeds and only on real version bumps.

      - name: Install mcp-publisher
        if: steps.check.outputs.skip == 'false'
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
      - name: Authenticate to MCP Registry (OIDC)
        if: steps.check.outputs.skip == 'false'
        run: ./mcp-publisher login github-oidc
      # The registry rejects republishing an existing version outright, so without
      # this pre-check a retry after a later-step failure would fail here forever
      # and the release would only be recoverable via a version bump.
      - name: Publish to MCP Registry
        if: steps.check.outputs.skip == 'false'
        env:
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          already=$(curl -sf --max-time 30 \
            "https://registry.modelcontextprotocol.io/v0/servers?search=io.github.arcadia-finance/mcp-server&version=${VERSION}" \
            | jq '[.servers[]] | length' || echo 0)
          if [ "$already" -gt 0 ]; then
            echo "MCP Registry already has ${VERSION}, skipping publish."
          else
            ./mcp-publisher publish
          fi

      # The CLI authenticates via SMITHERY_API_KEY only; it never reads a variable
      # named SMITHERY_TOKEN, so the previous env name meant this step silently
      # no-opped on every release. The qualified name is org/name with no leading
      # @ (the npm-style @scope/name form is not a valid Smithery identifier).
      - name: Publish to Smithery
        if: steps.check.outputs.skip == 'false'
        env:
          SMITHERY_API_KEY: ${{ secrets.SMITHERY_API_KEY }}
        run: |
          if [ -z "$SMITHERY_API_KEY" ]; then
            echo "::warning::SMITHERY_API_KEY not set, skipping Smithery publish."
            exit 0
          fi
          npx -y @smithery/cli mcp publish \
            https://mcp.arcadia.finance/mcp \
            -n arcadia-finance/mcp-server

      - name: Check openclaw skill version
        if: steps.check.outputs.skip == 'false'
        id: skill
        run: |
          CURR=$(awk '/^version:/ { print $2; exit }' skills/openclaw/SKILL.md)
          if [ -z "$CURR" ]; then
            echo "Could not read version from skills/openclaw/SKILL.md frontmatter."
            exit 1
          fi
          # Relative to the last released tag, not HEAD~1: on a manual retry after
          # further commits, HEAD~1 already carries the new skill version and the
          # publish that failed would be the one the retry skips.
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$LAST_TAG" ]; then
            PREV=$(git show "${LAST_TAG}:skills/openclaw/SKILL.md" 2>/dev/null | awk '/^version:/ { print $2; exit }' || echo "")
          else
            PREV=""
          fi
          if [ "$CURR" = "$PREV" ]; then
            echo "Skill version unchanged ($CURR); skipping ClawHub publish."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "version=$CURR" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish ClawHub skill
        if: steps.check.outputs.skip == 'false' && steps.skill.outputs.changed == 'true'
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
        run: |
          if [ -z "$CLAWHUB_TOKEN" ]; then
            echo "::warning::CLAWHUB_TOKEN not set, skipping ClawHub publish."
            exit 0
          fi
          npx -y clawhub login --token "$CLAWHUB_TOKEN" --no-input
          npx -y clawhub publish "$PWD/skills/openclaw" \
            --slug arcadia-finance \
            --name "Arcadia Finance" \
            --version "${{ steps.skill.outputs.version }}" \
            --no-input

      # ─── Verify before tagging ───
      # Every publish above can exit 0 without shipping: a missing credential hits a
      # guard, and npm's own step tolerates an existing version. Assert the release
      # is actually visible, and do it before the tag so a failure stays retryable.
      - name: Verify publishes landed
        if: steps.check.outputs.skip == 'false'
        env:
          VERSION: ${{ steps.check.outputs.version }}
          SMITHERY_API_KEY: ${{ secrets.SMITHERY_API_KEY }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          fail=0
          PKG="@arcadia-finance/mcp-server"
          SMITHERY_URL="https://registry.smithery.ai/servers/arcadia-finance/mcp-server"

          # --prefer-online is load-bearing, not a nicety. npm view answers from the
          # on-disk packument cache, and the registry serves it with
          # cache-control: max-age=300, so npm returns the cached copy without
          # revalidating for five minutes. The retry-tolerance pre-check in the
          # publish step above necessarily runs BEFORE the publish and caches a
          # packument that lacks the new version; npm publish does not invalidate it.
          # That is what failed 0.5.1 five seconds after a successful publish, and no
          # amount of polling inside the TTL would have changed the answer.
          npm_has_version() {
            npm view "${PKG}@${VERSION}" version --prefer-online >/dev/null 2>&1
          }

          registry_has_version() {
            curl -sf --max-time 30 \
              "https://registry.modelcontextprotocol.io/v0/servers?search=io.github.arcadia-finance/mcp-server&version=latest" \
              | jq -e --arg v "$VERSION" '[.servers[] | select(.server.version == $v)] | length > 0' \
                  >/dev/null 2>&1
          }

          # Both are polled in one loop, each dropped as it satisfies, so a genuine
          # failure in one does not serially burn the other's budget.
          npm_ok=0
          registry_ok=0
          slept=0
          while :; do
            if [ "$npm_ok" -eq 0 ] && npm_has_version; then
              echo "npm: ${VERSION} present"
              npm_ok=1
            fi
            if [ "$registry_ok" -eq 0 ] && registry_has_version; then
              echo "MCP Registry: ${VERSION} present"
              registry_ok=1
            fi
            [ "$npm_ok" -eq 1 ] && [ "$registry_ok" -eq 1 ] && break
            [ "$slept" -ge 90 ] && break
            echo "waiting for propagation, retrying in 10s (${slept}s elapsed)"
            sleep 10
            slept=$((slept + 10))
          done

          # On failure, re-run without suppressing output: the silent form exits
          # non-zero identically for a 404, a network blip and an auth failure, which
          # is why the 0.5.1 failure needed a re-run to understand.
          if [ "$npm_ok" -eq 0 ]; then
            echo "::group::npm view output"
            npm view "${PKG}@${VERSION}" version --prefer-online || true
            echo "::endgroup::"
            echo "::error::npm does not report ${VERSION} after ${slept}s"
            fail=1
          fi
          if [ "$registry_ok" -eq 0 ]; then
            echo "::group::MCP Registry response"
            curl -s --max-time 30 \
              "https://registry.modelcontextprotocol.io/v0/servers?search=io.github.arcadia-finance/mcp-server&version=latest" || true
            echo "::endgroup::"
            echo "::error::MCP Registry does not report ${VERSION} after ${slept}s"
            fail=1
          fi

          # Advisory. Smithery accepts a publish as PENDING and applies it
          # asynchronously, so a short poll keeps this from warning on every release
          # and going unread. This is the one check with a proven catch, so the
          # signal is worth protecting.
          if [ -n "$SMITHERY_API_KEY" ]; then
            smithery_slept=0
            while :; do
              if curl -sf --max-time 30 "$SMITHERY_URL" \
                | jq -e '.deploymentUrl == "https://mcp.arcadia.finance/mcp"' >/dev/null 2>&1; then
                echo "Smithery: listing points at the current deployment"
                break
              fi
              if [ "$smithery_slept" -ge 30 ]; then
                echo "::warning::Smithery listing still points at the previous deployment after ${smithery_slept}s. The publish is accepted asynchronously, so check the releases page if this persists."
                break
              fi
              sleep 10
              smithery_slept=$((smithery_slept + 10))
            done
          fi

          exit $fail

      # ─── Tag and release LAST ───
      # The version-bump gate above keys off this tag, so creating it only after
      # every publish has succeeded keeps a failed run fully retryable. Creating
      # it first would make the gate skip everything on the next attempt.
      - name: Create tag and release
        if: steps.check.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git tag "${{ steps.check.outputs.tag }}"
          git push origin "${{ steps.check.outputs.tag }}"
          # Not atomic with the tag push above: if the tag lands and this fails, the
          # gate would skip everything next run with no release created.
          gh release create "${{ steps.check.outputs.tag }}" \
            --title "${{ steps.check.outputs.tag }}" \
            --generate-notes \
            || gh release view "${{ steps.check.outputs.tag }}" >/dev/null
