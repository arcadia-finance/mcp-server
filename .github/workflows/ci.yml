name: CI
on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: corepack enable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --immutable
      - run: yarn build
      - run: yarn lint
      # yarn format is prettier --check over the whole repo, markdown included.
      # It was absent, which is how formatting drift in the README and skills docs
      # reached main unnoticed.
      - run: yarn format
      - run: yarn test --exclude '**/*integration.test.ts'
      - name: Verify version sync
        run: |
          VERSION=$(node -p "require('./package.json').version")
          node -e "
            const s = require('./server.json');
            const mismatches = [];
            if (s.version !== '${VERSION}') mismatches.push('server.json .version');
            const pkg = s.packages?.find(p => p.registryType === 'npm');
            if (pkg && pkg.version !== '${VERSION}') mismatches.push('server.json .packages[npm].version');
            if (mismatches.length) {
              console.error('Version mismatch: ' + mismatches.join(', ') + ' != ${VERSION}');
              process.exit(1);
            }
            console.log('All versions match ${VERSION}');
          "
